<style>
:root{--bg:#EEF6FB;--navy:#002763;--g:#00E992;--sky:#40BEFF;--cy:#30C9E3;--warn:#FF5A5F;--danger:#B3261E;--pri:#40BEFF;--deep:#002763;--tx:#002763;--tx2:#3F557A;--mint:#D6EFFD;--card:#fff;--ln:#D2E3F0;--amb:#FFECEC;--ambd:#8C1C22;--ambl:#FFB8BA;--on:#002763;--page:#E3EEF8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}

*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--page);color:var(--tx);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
#root{width:100%;max-width:430px;height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:3px solid #0b8f83;outline-offset:2px}
.phone{position:relative;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:26px;letter-spacing:-.6px;color:var(--deep)}h2{font-size:17px;margin:22px 0 10px}
.sub{color:var(--tx2);font-size:14px;line-height:1.45;margin:6px 0 16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(34,54,66,.05);margin-bottom:12px;display:block;width:100%}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:5px 11px;background:var(--mint);color:var(--deep)}
.pill.w{background:var(--amb);color:var(--ambd);border:1px solid var(--ambl)}.pill.g{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3)}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}

.ib.w{background:var(--amb);color:var(--ambd)}.ib.n{background:#EEF2F1;color:var(--tx2)}
.t{font-weight:600;font-size:15px}.d{font-size:13px;color:var(--tx2);line-height:1.4;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .card{margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:14px;background:var(--pri);color:#fff;font-weight:600;font-size:15px;padding:0 16px;text-align:center}
.btn.s{background:var(--mint);color:var(--deep)}.btn.o{background:#fff;border:1px solid var(--ln);color:var(--tx)}.btn.r{background:#fff;border:1px solid #E3B5AE;color:#9B3B2F}
.btn[disabled]{opacity:.6}
.nav{display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--tx2);padding:4px 0;min-height:56px;text-align:center;font-weight:500}
.nav button span.i{padding:4px 14px;border-radius:99px}.nav button[aria-current=page]{color:var(--deep);font-weight:700}.nav button[aria-current=page] span.i{background:var(--mint)}
.badge{position:absolute;top:-2px;right:6px;background:#C98200;color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center}
.proto{text-align:center;font-size:10px;letter-spacing:.8px;color:var(--tx2);padding:4px;background:var(--bg)}
.ov{position:absolute;inset:0;background:rgba(20,35,40,.45);display:flex;align-items:flex-end;z-index:20;animation:fi .2s}
.sheet{background:#fff;width:100%;max-height:90%;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px;animation:up .25s}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--tx);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;z-index:30;display:flex;gap:8px;align-items:center;animation:fi .2s}
.tabs{display:flex;background:#EAF0EE;border-radius:12px;padding:4px;margin-bottom:14px}

.sw{width:50px;height:30px;border-radius:99px;background:#C9D5D2;position:relative;flex:none;transition:.2s}.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-checked=true]{background:var(--pri)}.sw[aria-checked=true] i{left:23px}
input[type=text]{width:100%;min-height:48px;border:1px solid #C9D5D2;border-radius:12px;padding:0 14px;font:inherit;margin:6px 0 14px;color:var(--tx);background:#fff}

.seg{display:flex;gap:8px;margin:6px 0 14px}.seg button{flex:1;text-align:center;min-height:46px;border:1px solid #C9D5D2;border-radius:12px;font-weight:600}.seg button[aria-pressed=true]{background:var(--mint);border-color:var(--pri);color:var(--deep)}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}.kv b{font-weight:600}
.sep{border-top:1px solid var(--ln);margin:10px 0}
.map{border-radius:18px;overflow:hidden;border:1px solid var(--ln);background:#E8F0EC;position:relative}
.spin{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:12px;color:var(--tx2);line-height:1.4;margin:8px 2px}
.phone{color:var(--tx)}
.phone.dark{--bg:#021B45;--card:#0A3170;--tx:#F2F8FC;--tx2:#B9CDE8;--ln:#1D4A8A;--mint:#12408A;--amb:#4A2025;--ambd:#FFB3B6;--ambl:#8A3A40;--danger:#FF9A9D;--deep:#0A3170}
.phone.hc{--tx2:var(--tx);--ln:#7F97B0}
.rm *{animation:none!important;transition:none!important}
.hd{justify-content:flex-end;padding:12px 20px 0;background:transparent;border:0}
h1{color:var(--tx)}.av{color:var(--tx);width:40px;height:40px}
.pill{color:var(--tx)}.pill.w{color:var(--ambd)}.pill.g{color:#fff}
.ib,.ib.n{color:var(--tx)}.ib.w{color:var(--ambd)}.ib.n{background:var(--mint)}
.btn{color:var(--on)}.btn.s{color:var(--tx)}.btn.o{background:var(--card);color:var(--tx)}.btn.r{background:var(--card);border-color:#FF5A5F;color:var(--ambd)}
.nav,.sheet{background:var(--card)}.nav button[aria-current=page]{color:var(--tx)}.badge{background:#FF5A5F;color:#1B2A41}
.tabs{background:var(--mint)}.tabs button[aria-selected=true]{background:var(--card);color:var(--tx)}
.sw{background:#8FA6BD}
input[type=text],input[type=time],input[type=date]{width:100%;min-height:48px;border:1px solid #8FA6BD;border-radius:12px;padding:0 14px;font:inherit;margin:6px 0 14px;color:var(--tx);background:var(--card)}
.seg button{border-color:#8FA6BD}.seg button[aria-pressed=true]{background:var(--mint);border-color:var(--pri);color:var(--tx)}
.toast{background:#1B2A41;color:#fff;border:1px solid #3AA0FF}
button:focus-visible,input:focus-visible{outline-color:var(--tx)}
.slot{min-width:52px;font-weight:700;font-size:15px}
.hd{padding:14px 20px 0}
.av{background:var(--navy);color:#fff;box-shadow:0 0 0 3px var(--g)}
.main{position:relative;isolation:isolate}
h1{font-size:28px;font-weight:800;letter-spacing:-.8px}
h2{font-size:18px;font-weight:800;display:flex;align-items:center}
h2:before{content:"";width:8px;height:18px;border-radius:4px;background:var(--g);margin-right:8px}
.greet{position:relative}
.hero2{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:20px;padding:16px;box-shadow:none;margin-bottom:12px}


.hero2>*{position:relative;z-index:1}
.hero2 small{display:block;font-size:11px;letter-spacing:1px;font-weight:700;color:var(--g)}
.hero2 h3{font-size:28px;margin:2px 0 8px;letter-spacing:-.5px}
.pill.gr{background:var(--g);color:#002763}.pill.wn{background:var(--warn);color:#002763}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.stat{background:rgba(255,255,255,.12);border-radius:16px;padding:10px 12px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:120px;padding:14px;border-radius:22px;color:#002763}
.tile b{font-size:17px}.tile span{font-size:13px;font-weight:600;display:block}
.tile .ico{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.55);display:grid;place-items:center}
.t-g{background:var(--g)}.t-sky{background:var(--sky)}.t-cy{background:var(--cy)}.t-navy{background:var(--navy);color:#fff}.t-navy .ico{background:rgba(255,255,255,.16)}
.c-sky{background:var(--sky);color:#002763;border:0}.c-cy{background:var(--cy);color:#002763;border:0}.c-sky .d,.c-cy .d{color:#002763}
.c-warn{background:var(--amb);border-color:var(--ambl)}
.ib.g{background:var(--g);color:#002763}.ib.sky{background:var(--sky);color:#002763}.ib.cy{background:var(--cy);color:#002763}.ib.navy{background:var(--navy);color:#fff}.ib.wn{background:var(--warn);color:#002763}
.srow{width:100%;padding:12px 0;border-top:1px solid var(--ln)}.srow:first-child{border:0}
.btn.g{background:var(--g);color:#002763}
.btn.r{border-color:var(--danger);color:var(--danger)}
.nav{background:#002763;border-radius:22px 22px 0 0;border-top:0}
.nav button{color:#CFE0F7}.nav button[aria-current=page]{color:#fff}.nav button[aria-current=page] span.i{background:var(--g);color:#002763}
.badge{background:var(--g);color:#002763}
.tabs button[aria-selected=true]{background:var(--navy);color:#fff}
.phone.dark .tabs button[aria-selected=true],.phone.dark .seg button[aria-pressed=true]{background:var(--g);color:#002763;border-color:var(--g)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.sw[aria-checked=true]{background:var(--g)}.sw[aria-checked=true] i{background:#002763}
input[type=range]{accent-color:var(--navy)}
.toast{background:#002763;border-color:var(--g)}
.chip{position:absolute;left:10px;top:10px;background:var(--navy);color:#fff;border-radius:99px;padding:5px 12px 5px 5px;font-size:12px;font-weight:600;display:flex;gap:8px;align-items:center}
.tl{position:relative;padding-left:40px}.tl:before{content:"";position:absolute;left:17px;top:8px;bottom:8px;width:3px;background:var(--sky);border-radius:2px;opacity:.5}
.tli{position:relative;margin-bottom:12px}
.dot{position:absolute;left:-40px;top:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--bg);color:#002763}
.slotb{min-width:88px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-weight:800;font-size:21px;color:#002763}.slotb small{font-size:11px;font-weight:700}
.gl{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--tx2);margin:14px 0 8px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}.cg b{font-size:12px;color:var(--tx2)}
.dc{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-size:14px;position:relative}.dc.td{background:var(--g);font-weight:800;color:#002763}.dc.hs{background:var(--cy);font-weight:800;color:#002763}.dc i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#002763}
.mc{background:var(--navy);color:#fff;border-radius:20px;padding:16px;margin-bottom:8px}
.mc .lb2{font-size:11px;letter-spacing:1px;font-weight:700;color:var(--g)}
.mc .nm{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:2px 0 6px}
.stl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.sd{width:10px;height:10px;border-radius:50%;flex:none;background:var(--g)}.sd.out{background:#FF5A5F}.sd.unk{background:transparent;border:2px solid #A9BBD6}
.sm{font-size:13px;color:#C7D9F2;margin-top:4px}
.mf{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:#DCE8F8;border-top:1px solid rgba(255,255,255,.16);margin-top:14px;padding-top:12px}
.mf span{display:flex;align-items:center;gap:6px}.mbar{width:44px;height:6px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;display:inline-block}.mbar i{display:block;height:100%;background:var(--g)}
.ab{background:#FF5A5F;color:#002763;border-radius:14px;padding:12px;margin-top:14px}
.ab1,.ab2{flex:1;min-height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13.5px;text-align:center;padding:0 8px}.ab1{background:#002763;color:#fff}.ab2{background:#fff;color:#002763}
.qa2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qt{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;min-height:60px}
.qt b{display:block;font-size:14px}.qt small{display:block;font-size:12px;color:var(--tx2);font-weight:500}
.qi{width:36px;height:36px;border-radius:10px;background:var(--mint);display:grid;place-items:center;flex:none;color:var(--tx)}
.qt.hot{border:2px solid #FF5A5F;background:rgba(255,90,95,.1)}.qt.hot .qi{background:#FF5A5F;color:#002763}
.lb{font-size:12px;color:var(--tx2);font-weight:600}.ln{font-size:15px;font-weight:600}
.ib.n{background:var(--mint)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  ${mf?html`<${Sheet} title=${mf.id?'Editar medicamento':'Novo medicamento'} close=${()=>setMf(null)}><label class="t" for="mn">Nome</label><input id="mn" type="text" value=${mf.n} onInput=${e=>setMf({...mf,n:e.target.value})}/><label class="t" for="md">Dosagem (conforme a receita)</label><input id="md" type="text" value=${mf.dose} onInput=${e=>setMf({...mf,dose:e.target.value})}/><div class="t">Frequência</div><div class="seg">${['1x ao dia','2x ao dia','3x ao dia'].map((f,i)=>html`<button key=${f} aria-pressed=${mf.freq===f} onClick=${()=>setMf({...mf,freq:f,times:Array.from({length:i+1},(_,j)=>mf.times[j]||['08:00','14:00','20:00'][j])})}>${f}</button>`)}</div>${mf.times.map((t,j)=>html`<div key=${j}><label class="t" for=${'t'+j}>Horário ${j+1}</label><input id=${'t'+j} type="time" value=${t} onInput=${e=>setMf({...mf,times:mf.times.map((x,k)=>k===j?e.target.value:x)})}/></div>`)}<label class="t" for="mo">Observações (opcional)</label><input id="mo" type="text" value=${mf.obs} onInput=${e=>setMf({...mf,obs:e.target.value})}/><button class="btn" onClick=${saveMed}>Salvar</button>${mf.id?html`<button class="btn r" style=${{marginTop:10}} onClick=${()=>setCf({msg:'Excluir '+mf.n+'? Os registros anteriores permanecem no histórico.',ok:()=>{setMeds(m=>m.filter(x=>x.id!==mf.id));setMf(null);say('Medicamento excluído.')}})}><${Ic} n="trash" s=${18}/>Excluir</button>`:null}<div class="note">Dados fictícios. Não substitui a orientação médica.</div><//>`:null}
  ${af?html`<${Sheet} title=${af.id?'Editar consulta':'Nova consulta'} close=${()=>setAf(null)}><label class="t" for="ae1">Especialidade</label><input id="ae1" type="text" value=${af.esp} onInput=${e=>setAf({...af,esp:e.target.value})}/><label class="t" for="ap1">Profissional</label><input id="ap1" type="text" value=${af.pro} onInput=${e=>setAf({...af,pro:e.target.value})}/><label class="t" for="ad1">Data</label><input id="ad1" type="date" value=${af.date} onInput=${e=>setAf({...af,date:e.target.value})}/><label class="t" for="ah1">Horário</label><input id="ah1" type="time" value=${af.time} onInput=${e=>setAf({...af,time:e.target.value})}/><label class="t" for="al1">Local</label><input id="al1" type="text" value=${af.loc} onInput=${e=>setAf({...af,loc:e.target.value})}/><div class="row sp" style=${{marginBottom:16}}><span class="t">Lembrete antes da consulta</span><${Sw} on=${af.rem} label="Lembrete" set=${v=>setAf({...af,rem:v})}/></div><button class="btn" onClick=${saveAp}>Salvar</button>${af.id?html`<button class="btn r" style=${{marginTop:10}} onClick=${()=>setCf({msg:'Excluir a consulta de '+af.esp+'?',ok:()=>{setAppts(l=>l.filter(x=>x.id!==af.id));setAf(null);say('Consulta excluída.')}})}><${Ic} n="trash" s=${18}/>Excluir</button>`:null}<//>`:null}
  ${ga?html`<${Sheet} title="Google Agenda" close=${()=>setGa(null)}><div class="card"><div class="t">Consulta: ${ga.esp}</div><div class="d">${ga.pro}</div><div class="d">${br(ga.date)} · ${ga.time} · ${ga.loc}</div></div><a class="btn" href=${gcal(ga)} target="_blank" rel="noopener noreferrer" style=${{textDecoration:'none'}} onClick=${()=>say('Evento preparado no Google Agenda.')}><${Ic} n="cal" s=${18}/>Abrir no Google Agenda</a><div class="note">Simulação: o evento é preparado em uma nova aba e só é salvo se você entrar na sua conta Google. O Cordão não acessa sua agenda.</div><//>`:null}
  ${cf?html`<${Sheet} title="Confirmar ação" close=${()=>setCf(null)}><p class="d" style=${{marginBottom:16,color:'var(--tx)',fontSize:15}}>${cf.msg}</p><div class="grid2"><button class="btn o" onClick=${()=>setCf(null)}>Cancelar</button><button class="btn r" onClick=${()=>{cf.ok();setCf(null)}}>Confirmar</button></div><//>`:null}
  ${toast?html`<div class="toast" role="status"><${Ic} n="check" s=${18}/>${toast}</div>`:null}</div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
